<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Der Tunnelbauer – LiteraturZeitung</title>
    <link rel="icon" type="image/png" href="/static/site-icon.png">
    <link rel="apple-touch-icon" href="/static/site-icon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --black:  #0a0a0a;
            --gold:   #E8A020;
            --gold2:  #F5C842;
            --silver: #A8A8A8;
            --white:  #F5F0E8;
            --text:   #C8C0B0;
            --muted:  #777777;
            --border: #2a2a2a;
        }

        html, body {
            height: 100%;
            background: var(--black);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        /* Gold stripes */
        .stripe {
            position: fixed;
            left: 0; right: 0;
            height: 5px;
            background: var(--gold);
            z-index: 10;
        }
        .stripe-top    { top: 0; }
        .stripe-bottom { bottom: 0; }

        /*  wrapper for immersive 3D zoom effect */
        .tunnel-bg-wrapper {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0a0a0a;
            z-index: 1;
            overflow: hidden;
        }

        /* The actual image — this is what zooms */
        .tunnel-bg-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            object-position: center 48%;
            transform-origin: 50% 48%;
            transform: scale(1);
            transition: transform 0.8s cubic-bezier(0.55, 0.06, 0.68, 0.19),
                        opacity  0.8s ease-in;
            will-change: transform;
        }

        /* Full-screen layout container */
        .cover-layout {
            position: relative;
            height: 100vh;
            width: 100%;
            z-index: 2;
        }

        /* Side panels for theatrical layout */
        .cover-side {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 3;
        }

        .cover-book-side {
            left: 6vw;
        }

        .cover-info-side {
            right: 6vw;
            width: 28vw;
            max-width: 360px;
        }

        /* Book cover image */
        .cover-book-img {
            width: clamp(110px, 13vw, 180px);
            height: auto;
            border-radius: 3px;
            box-shadow: 6px 10px 40px rgba(0,0,0,0.85);
            display: block;
        }

        /* Centre info */
        .cover-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 0;
        }

        .cover-kicker {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .cover-kicker::before,
        .cover-kicker::after {
            content: '';
            display: block;
            width: 36px;
            height: 1px;
            background: var(--border);
        }

        .cover-logo {
            display: block;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.7));
            margin-bottom: 0.9rem;
        }

        .cover-rule {
            width: 100%;
            height: 1px;
            background: var(--border);
            margin: 0.6rem 0 0.9rem;
            position: relative;
        }
        .cover-rule::before,
        .cover-rule::after {
            content: '◆';
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gold);
            font-size: 7px;
        }
        .cover-rule::before { left: 0; }
        .cover-rule::after  { right: 0; }

        .cover-book-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            font-weight: 700;
            color: var(--white);
            margin-bottom: 0.2rem;
        }

        .cover-author {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            color: var(--gold);
            letter-spacing: 0.05em;
            margin-bottom: 1.1rem;
        }

        .cover-editors-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }

        .cover-editors {
            font-family: 'Lora', serif;
            font-style: italic;
            font-size: 0.82rem;
            color: var(--silver);
            line-height: 1.8;
        }

        /* Tunnel column positioned precisely over the background hole */
        .tunnel-col {
            position: absolute;
            left: 50%;
            top: 48%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tunnel-label {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            transition: color 0.25s, opacity 0.3s;
        }

        .tunnel-col:hover .tunnel-label,
        .tunnel-col:active .tunnel-label { color: var(--gold); }

        /* SVG tunnel portal overlay */
        .tunnel-portal {
            width: clamp(120px, 15vw, 180px);
            height: clamp(120px, 15vw, 180px);
            border-radius: 50%;
            display: block;
            transition: transform 0.2s;
        }

        .tunnel-col:hover .tunnel-portal  { transform: scale(1.05); }
        .tunnel-col:active .tunnel-portal { transform: scale(0.97); }

        .tunnel-portal svg { width: 100%; height: 100%; display: block; }

        .tunnel-hint {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--border);
            transition: color 0.25s, opacity 0.3s;
        }
        .tunnel-col:hover .tunnel-hint { color: var(--gold); }

        /* Glow pulse */
        @keyframes tunnelGlow {
            0%, 100% { filter: drop-shadow(0 0 0px rgba(232,160,32,0)); }
            50%       { filter: drop-shadow(0 0 16px rgba(232,160,32,0.4)); }
        }
        .tunnel-portal { animation: tunnelGlow 2.8s ease-in-out infinite; }

        /* Immersive Enter Animations */
        
        body.entering .cover-book-side {
            opacity: 0;
            transform: translateY(-50%) scale(0.85);
        }

        body.entering .cover-info-side {
            opacity: 0;
            transform: translateY(-50%) scale(0.85);
        }

        body.entering .tunnel-label,
        body.entering .tunnel-hint {
            opacity: 0;
        }

        body.entering .tunnel-portal {
            transform: scale(15);
            opacity: 0;
            transition: transform 0.8s cubic-bezier(0.55, 0.06, 0.68, 0.19), opacity 0.6s ease-in;
        }

        /* Responsive Mobile Layout */
        @media (max-width: 768px) {
            html, body { overflow: auto; }
            
            .cover-book-side {
                position: absolute;
                top: 4vh;
                left: 50%;
                transform: translateX(-50%);
                text-align: center;
            }
            
            .cover-book-img {
                width: 75px;
            }

            .cover-info-side {
                position: absolute;
                bottom: 4vh;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 320px;
            }

            .cover-logo {
                width: 220px;
                margin: 0 auto 0.4rem;
            }

            .cover-rule {
                margin: 0.4rem 0 0.6rem;
            }

            .tunnel-col {
                top: 49%;
            }

            .tunnel-portal {
                width: 110px;
                height: 110px;
            }

            /* Zoom adjustment for mobile transitions */
            body.entering .cover-book-side {
                transform: translateX(-50%) scale(0.8);
                opacity: 0;
            }
            body.entering .cover-info-side {
                transform: translateX(-50%) scale(0.8);
                opacity: 0;
            }
        }

        /* Semi-transparent backdrop behind right info panel */
        .cover-info-side {
            background: rgba(10, 10, 10, 0.62);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(232, 160, 32, 0.15);
            border-radius: 6px;
            padding: 1.8rem 2rem;
        }

        /* ── SUCK-IN ENTER EFFECT ──────────────────────
           Everything shrinks toward the tunnel centre,
           background zooms in, overlay fades to black.
        ─────────────────────────────────────────────── */

        /* Dark overlay that fades in on top */
        .enter-overlay {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.7s ease-in 0.55s;
        }

        body.entering .enter-overlay {
            opacity: 1;
        }

        /* Light flash from the tunnel */
        .tunnel-flash {
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse 50% 60% at 50% 46%,
                rgba(120, 200, 255, 1)    0%,
                rgba(40,  140, 255, 0.92) 18%,
                rgba(0,   80,  255, 0.65) 40%,
                rgba(0,   30,  180, 0.2)  65%,
                transparent 82%);
            opacity: 0;
            pointer-events: none;
            z-index: 99;
            transition: opacity 0.07s ease-out;
        }

        body.flashing .tunnel-flash {
            opacity: 1;
        }

        body.flash-out .tunnel-flash {
            opacity: 0;
            transition: opacity 0.45s ease-in;
        }

        /* Background zooms into tunnel — starts immediately on click */
        body.entering .tunnel-bg-img {
            transform: scale(12);
            opacity: 0;
            transition: transform 1.1s cubic-bezier(0.2, 0, 0.6, 0.5),
                        opacity  0.8s ease-in 0.3s;
        }

        /* Side panels shrink & fade toward centre */
        body.entering .cover-book-side {
            opacity: 0;
            transform: translateY(-50%) translateX(8vw) scale(0.4);
            transition: opacity 0.5s ease-in, transform 0.6s cubic-bezier(0.6, 0, 1, 0.4);
        }

        body.entering .cover-info-side {
            opacity: 0;
            transform: translateY(-50%) translateX(-8vw) scale(0.4);
            transition: opacity 0.5s ease-in, transform 0.6s cubic-bezier(0.6, 0, 1, 0.4);
        }

        /* Tunnel label/hint shrinks */
        body.entering .tunnel-label,
        body.entering .tunnel-hint {
            opacity: 0;
            transform: scale(0.3);
            transition: opacity 0.3s ease-in, transform 0.4s ease-in;
        }

        /* Portal itself implodes into the tunnel */
        body.entering .tunnel-portal {
            transform: scale(0.05);
            opacity: 0;
            transition: transform 0.7s cubic-bezier(0.6, 0, 1, 0.5),
                        opacity  0.5s ease-in 0.1s;
        }

        @media (max-width: 768px) {
            body.entering .cover-book-side {
                transform: translateX(-50%) scale(0.3);
                opacity: 0;
            }
            body.entering .cover-info-side {
                transform: translateX(-50%) scale(0.3);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="enter-overlay"></div>
<div class="tunnel-flash"></div>
<div class="stripe stripe-top"></div>
<div class="stripe stripe-bottom"></div>

<!-- Background image layer -->
<div class="tunnel-bg-wrapper"><img class="tunnel-bg-img" src="/static/tunnel-bg.png" alt="" draggable="false"></div>

<div class="cover-layout">

    <!-- Left Panel: Book Cover -->
    <div class="cover-side cover-book-side">
        <img class="cover-book-img" src="/static/book_cover.png" alt="Der Tunnelbauer – Buchcover">
    </div>

    <!-- Center: Interactive Tunnel Portal -->
    <div class="tunnel-col" id="tunnel-col">
        <div class="tunnel-label">Eintreten</div>

        <div class="tunnel-portal">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Only one invisible clickable ellipse covers the central area -->
                <ellipse cx="100" cy="100" rx="96" ry="96" fill="rgba(0,0,0,0.01)" stroke="none"/>
            </svg>
        </div>

        <div class="tunnel-hint">tippen</div>
    </div>

    <!-- Right Panel: Information -->
    <div class="cover-side cover-info-side">
        <div class="cover-info">
            <div class="cover-kicker">Literaturzeitung</div>

            <img class="cover-logo" src="/static/page-logo.png" alt="LiteraturZeitung – Der Tunnelbauer">

            <div class="cover-rule"></div>

            <div class="cover-book-title">Der Tunnelbauer</div>
            <div class="cover-author">Maja Nielsen</div>

            <div class="cover-editors-label">Redaktion</div>
            <div class="cover-editors">
                ......
            </div>
        </div>
    </div>

</div>

<script>
    var tunnelCol = document.getElementById('tunnel-col');
    var clicked   = false;

    function enter() {
        if (clicked) return;
        clicked = true;

        // Flash + zoom start simultaneously
        document.body.classList.add('flashing');
        document.body.classList.add('entering');

        // Flash fades out after 100ms
        setTimeout(function () {
            document.body.classList.remove('flashing');
            document.body.classList.add('flash-out');
        }, 100);

        // Navigate after animation completes
        setTimeout(function () {
            window.location.href = '/zeitung';
        }, 1200);
    }

    tunnelCol.addEventListener('click',    enter);
    tunnelCol.addEventListener('touchend', function(e) {
        e.preventDefault();
        enter();
    });

    // Subtle idle parallax on mouse move
    document.addEventListener('mousemove', function(e) {
        if (clicked) return;
        var cx = window.innerWidth  / 2;
        var cy = window.innerHeight / 2;
        var dx = (e.clientX - cx) / cx;  // -1 … +1
        var dy = (e.clientY - cy) / cy;
        var bg = document.querySelector('.tunnel-bg-img');
        bg.style.transform = 'translate(' + (dx * -6) + 'px, ' + (dy * -5) + 'px) scale(1.06)';
    });
</script>

</body>
</html>
